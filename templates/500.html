{% extends "base.html" %}
{% block title %}500 Server Error - FITCORE{% endblock %}
{% block content %}
<div class="text-center py-5">
  <div class="display-1 fw-bold text-danger mb-3">500</div>
  <h2 class="fw-bold mb-2">Internal Server Error</h2>
  <p class="text-muted mb-4">An unexpected error occurred while processing your request. Please try again or check the system logs.</p>
  <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary-fc">
    <i class="bi bi-arrow-clockwise me-1"></i> Return to Dashboard
  </a>
</div>
{% endblock %}
