{% extends "base.html" %}

{% block title %}Create Membership Plan - FITCORE{% endblock %}

{% block content %}
<div class="mb-4">
  <a href="{{ url_for('memberships.list_plans') }}" class="text-decoration-none text-muted small">
    &larr; Back to Membership Plans
  </a>
  <h1 class="h3 fw-bold mt-1">Create Membership Plan</h1>
  <p class="text-muted small mb-0">Define plan duration, pricing, and benefits</p>
</div>

<div class="row">
  <div class="col-12 col-lg-7">
    <div class="fc-card p-4">
      <form method="POST" action="{{ url_for('memberships.add_plan') }}">
        
        <div class="mb-3">
          <label for="name" class="form-label">Plan Name *</label>
          <input type="text" class="form-control" id="name" name="name" placeholder="e.g. Quarterly Pro" required value="{{ form.name if form else '' }}">
        </div>

        <div class="row g-3 mb-3">
          <div class="col-12 col-md-6">
            <label for="duration_days" class="form-label">Duration (Days) *</label>
            <input type="number" class="form-control" id="duration_days" name="duration_days" min="1" placeholder="e.g. 90" required value="{{ form.duration_days if form else '30' }}">
          </div>

          <div class="col-12 col-md-6">
            <label for="price" class="form-label">Price (INR) *</label>
            <input type="number" step="0.01" class="form-control" id="price" name="price" min="0" placeholder="e.g. 2500" required value="{{ form.price if form else '' }}">
          </div>
        </div>

        <div class="mb-3">
          <label for="description" class="form-label">Plan Description & Privileges</label>
          <textarea class="form-control" id="description" name="description" rows="3" placeholder="Access to cardio, strength section, lockers...">{{ form.description if form else '' }}</textarea>
        </div>

        <div class="mb-4">
          <label for="status" class="form-label">Status</label>
          <select class="form-select" id="status" name="status">
            <option value="Active">Active (Available for member enrollments)</option>
            <option value="Inactive">Inactive</option>
          </select>
        </div>

        <div class="d-flex justify-content-end gap-2 pt-3 border-top">
          <a href="{{ url_for('memberships.list_plans') }}" class="btn btn-secondary-fc">Cancel</a>
          <button type="submit" class="btn btn-primary-fc px-4">
            <i class="bi bi-check-circle me-1"></i> Save Plan
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
