{% extends "base.html" %}

{% block title %}Edit Trainer: {{ trainer.name }} - FITCORE{% endblock %}

{% block content %}
<div class="mb-4">
  <a href="{{ url_for('trainers.view_trainer', trainer_id=trainer.trainer_id) }}" class="text-decoration-none text-muted small">
    &larr; Back to Trainer Profile
  </a>
  <h1 class="h3 fw-bold mt-1">Edit Trainer: {{ trainer.name }}</h1>
  <p class="text-muted small mb-0">Update coach information and compensation details</p>
</div>

<div class="row">
  <div class="col-12 col-lg-8">
    <div class="fc-card p-4">
      <form method="POST" action="{{ url_for('trainers.edit_trainer', trainer_id=trainer.trainer_id) }}" enctype="multipart/form-data">
        
        <div class="row g-3 mb-4">
          <div class="col-12 col-md-6">
            <label for="name" class="form-label">Full Name *</label>
            <input type="text" class="form-control" id="name" name="name" value="{{ trainer.name }}" required>
          </div>

          <div class="col-6 col-md-3">
            <label for="age" class="form-label">Age</label>
            <input type="number" class="form-control" id="age" name="age" min="18" max="80" value="{{ trainer.age or '' }}">
          </div>

          <div class="col-6 col-md-3">
            <label for="gender" class="form-label">Gender</label>
            <select class="form-select" id="gender" name="gender">
              <option value="Male" {% if trainer.gender == 'Male' %}selected{% endif %}>Male</option>
              <option value="Female" {% if trainer.gender == 'Female' %}selected{% endif %}>Female</option>
              <option value="Other" {% if trainer.gender == 'Other' %}selected{% endif %}>Other</option>
            </select>
          </div>

          <div class="col-12 col-md-6">
            <label for="phone" class="form-label">Phone Number *</label>
            <input type="tel" class="form-control" id="phone" name="phone" value="{{ trainer.phone }}" required>
          </div>

          <div class="col-12 col-md-6">
            <label for="email" class="form-label">Email Address</label>
            <input type="email" class="form-control" id="email" name="email" value="{{ trainer.email or '' }}">
          </div>

          <div class="col-12 col-md-6">
            <label for="specialization" class="form-label">Specialization *</label>
            <select class="form-select" id="specialization" name="specialization" required>
              {% for s in specializations %}
                <option value="{{ s }}" {% if trainer.specialization == s %}selected{% endif %}>{{ s }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="col-12 col-md-6">
            <label for="experience" class="form-label">Experience</label>
            <input type="text" class="form-control" id="experience" name="experience" value="{{ trainer.experience or '' }}">
          </div>

          <div class="col-12 col-md-6">
            <label for="salary" class="form-label">Monthly Salary (INR)</label>
            <input type="number" class="form-control" id="salary" name="salary" value="{{ trainer.salary or '' }}">
          </div>

          <div class="col-12 col-md-6">
            <label for="status" class="form-label">Status</label>
            <select class="form-select" id="status" name="status">
              <option value="Active" {% if trainer.status == 'Active' %}selected{% endif %}>Active</option>
              <option value="Inactive" {% if trainer.status == 'Inactive' %}selected{% endif %}>Inactive</option>
            </select>
          </div>

          <div class="col-12">
            <label for="profile_photo" class="form-label">Update Coach Photo</label>
            <input type="file" class="form-control" id="profile_photo" name="profile_photo" accept="image/png, image/jpeg, image/jpg">
          </div>
        </div>

        <div class="d-flex justify-content-end gap-2 pt-3 border-top">
          <a href="{{ url_for('trainers.view_trainer', trainer_id=trainer.trainer_id) }}" class="btn btn-secondary-fc">Cancel</a>
          <button type="submit" class="btn btn-primary-fc px-4">
            <i class="bi bi-save me-1"></i> Save Changes
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
